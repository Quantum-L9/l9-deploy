# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer:
# - repository
# tags:
# - L9_META
# - deployment-platform
# owner: platform
# status: active
# --- /L9_META ---
schema: l9.fleet-inventory/v1
management:
  runner_server_id: l9-deploy-01
  private_cidr: 10.90.1.0/24
environments:
  management:
    approval_required: true
    concurrency_group: l9-management
    allowed_source_refs: [refs/heads/main, refs/tags/v*]
  staging:
    approval_required: false
    concurrency_group: l9-staging
    allowed_source_refs: [refs/heads/main]
  production:
    approval_required: true
    concurrency_group: l9-production
    allowed_source_refs: [refs/tags/v*]
servers:
  - schema: l9.server-profile/v1
    id: l9-deploy-01
    environment: management
    provider: hetzner
    private_ip: 10.90.1.10
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [management]
    labels: {managed_by: l9-deployment-platform}
    conformance: {profile: management-runner, max_age_hours: 24}
  # Application/cache host for the l9-graphiti-memory active-memory service (memory
  # server + its private, ACL-scoped Redis co-located; v1 is rolling-single-host).
  # Provisional private IPs below MUST equal TF_VAR_servers[<id>].private_ip supplied
  # from Infisical at provision time (no automated tofu -> registry feedback exists).
  - schema: l9.server-profile/v1
    id: mem-staging-01
    environment: staging
    provider: hetzner
    private_ip: 10.90.10.10
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, cache]
    labels: {managed_by: l9-deployment-platform, workload: graphiti-memory}
    conformance: {profile: application, max_age_hours: 24}
  - schema: l9.server-profile/v1
    id: mem-prod-01
    environment: production
    provider: hetzner
    private_ip: 10.90.20.10
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, cache]
    labels: {managed_by: l9-deployment-platform, workload: graphiti-memory}
    conformance: {profile: application, max_age_hours: 24}
  # Application/worker host for SEO-Bot (registration only; its full deploy stays
  # gated on postgres, which is out of scope for this change).
  - schema: l9.server-profile/v1
    id: seo-staging-01
    environment: staging
    provider: hetzner
    private_ip: 10.90.10.20
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, worker]
    labels: {managed_by: l9-deployment-platform, workload: seo-bot}
    conformance: {profile: application, max_age_hours: 24}
  - schema: l9.server-profile/v1
    id: seo-prod-01
    environment: production
    provider: hetzner
    private_ip: 10.90.20.20
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, worker]
    labels: {managed_by: l9-deployment-platform, workload: seo-bot}
    conformance: {profile: application, max_age_hours: 24}
  # Reserved managed staging host for the public l9-cognitive-runtime MCP service.
  # This registry coordinate is a provisioning contract, not evidence that the host
  # already exists. TF_VAR_servers[mcp-staging-01].private_ip MUST be 10.90.10.30;
  # after apply, transcribe the real Hetzner public IP into public_ip before release.
  - schema: l9.server-profile/v1
    id: mcp-staging-01
    environment: staging
    provider: hetzner
    private_ip: 10.90.10.30
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application]
    labels: {managed_by: l9-deployment-platform, workload: l9-cognitive-runtime}
    conformance: {profile: application, max_age_hours: 24}
projects:
  - id: graphiti-memory
    repository: Quantum-L9/l9-graphiti-memory
    profile_path: integrations/consumers/graphiti-memory.deployment.yaml
    environments:
      staging: {server_ids: [mem-staging-01], infisical_environment: staging}
      production: {server_ids: [mem-prod-01], infisical_environment: prod}
  - id: seo-bot
    repository: Quantum-L9/SEO-Bot
    profile_path: integrations/consumers/seo-bot.deployment.yaml
    environments:
      staging: {server_ids: [seo-staging-01], infisical_environment: staging}
      production: {server_ids: [seo-prod-01], infisical_environment: prod}
  - id: l9-cognitive-runtime
    repository: Quantum-L9/l9-cognitive-runtime
    profile_path: integrations/consumers/l9-cognitive-runtime.deployment.yaml
    environments:
      staging:
        server_ids: [mcp-staging-01]
        infisical_environment: staging
        public_hostnames: [mcp-staging.quantumaipartners.com]
