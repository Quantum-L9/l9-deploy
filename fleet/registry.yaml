# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer:
# - repository
# tags:
# - L9_META
# - deployment-platform
# owner: platform
# status: active
# --- /L9_META ---
schema: l9.fleet-inventory/v1
management:
  runner_server_id: l9-deploy-01
  private_cidr: 10.90.1.0/24
environments:
  management:
    approval_required: true
    concurrency_group: l9-management
    allowed_source_refs: [refs/heads/main, refs/tags/v*]
  staging:
    approval_required: false
    concurrency_group: l9-staging
    allowed_source_refs: [refs/heads/main]
  production:
    approval_required: true
    concurrency_group: l9-production
    allowed_source_refs: [refs/tags/v*]
servers:
  - schema: l9.server-profile/v1
    id: l9-deploy-01
    environment: management
    provider: hetzner
    private_ip: 10.90.1.10
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [management]
    labels: {managed_by: l9-deployment-platform}
    conformance: {profile: management-runner, max_age_hours: 24}
  # Application/cache host for the l9-graphiti-memory active-memory service (memory
  # server + its private, ACL-scoped Redis co-located; v1 is rolling-single-host).
  # Provisional private IPs below MUST equal TF_VAR_servers[<id>].private_ip supplied
  # from Infisical at provision time (no automated tofu -> registry feedback exists).
  - schema: l9.server-profile/v1
    id: mem-staging-01
    environment: staging
    provider: hetzner
    private_ip: 10.90.10.10
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, cache]
    labels: {managed_by: l9-deployment-platform, workload: graphiti-memory}
    conformance: {profile: application, max_age_hours: 24}
  - schema: l9.server-profile/v1
    id: mem-prod-01
    environment: production
    provider: hetzner
    private_ip: 10.90.20.10
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, cache]
    labels: {managed_by: l9-deployment-platform, workload: graphiti-memory}
    conformance: {profile: application, max_age_hours: 24}
  # Application/worker host for SEO-Bot (registration only; its full deploy stays
  # gated on postgres, which is out of scope for this change).
  - schema: l9.server-profile/v1
    id: seo-staging-01
    environment: staging
    provider: hetzner
    private_ip: 10.90.10.20
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, worker]
    labels: {managed_by: l9-deployment-platform, workload: seo-bot}
    conformance: {profile: application, max_age_hours: 24}
  - schema: l9.server-profile/v1
    id: seo-prod-01
    environment: production
    provider: hetzner
    private_ip: 10.90.20.20
    public_ip: null
    ssh: {user: l9deploy, port: 22}
    roles: [application, worker]
    labels: {managed_by: l9-deployment-platform, workload: seo-bot}
    conformance: {profile: application, max_age_hours: 24}
  # Existing Hetzner C1 host adopted for the l9-cognitive-runtime staging placement.
  # Cursor-Governance is authoritative for this protected host: 46.62.243.82, root
  # SSH, and an already-live Caddy edge. No private-network coordinate is invented.
  # lifecycle=adopted prevents the normal l9-deploy host-configuration plane from
  # treating C1 as a provisioned/owned fleet server.
  - schema: l9.server-profile/v1
    id: c1
    environment: staging
    provider: hetzner
    lifecycle: adopted
    private_ip: null
    public_ip: 46.62.243.82
    ssh: {user: root, port: 22}
    roles: [application]
    labels:
      managed_by: external
      workload: shared-c1
      protection: c1
      caddy_management: external
    conformance: {profile: adopted-c1, max_age_hours: 24}
projects:
  # profile_path is relative to the registered consumer repository and is read only
  # at the request's exact source commit (deploy-dispatch.yml). This repository holds
  # no consumer profile authority; integrations/consumers/ are test fixtures only.
  #
  # BLOCKED: l9-graphiti-memory is ProductKind=dependency (product-topology.yaml,
  # ADR-094): a Python distribution with consumer-owned process lifecycle, no OCI
  # image and no hosted deployment profile. Its repository publishes no
  # .l9/deployment.yaml, so every deployment request fails closed at profile
  # resolution. This entry keeps Deploy's host mapping only, pending the actual
  # hosting consumer, which must register under its own repository and profile.
  - id: graphiti-memory
    repository: Quantum-L9/l9-graphiti-memory
    profile_path: .l9/deployment.yaml
    environments:
      staging: {server_ids: [mem-staging-01], infisical_environment: staging}
      production: {server_ids: [mem-prod-01], infisical_environment: prod}
  # BLOCKED: Quantum-L9/SEO-Bot does not yet publish its consumer-owned
  # .l9/deployment.yaml (absent at 16a844f829a1d8db01dfad3d66247e9abb4e5501), so
  # deployment fails closed at profile resolution until SEO-Bot adds it.
  - id: seo-bot
    repository: Quantum-L9/SEO-Bot
    profile_path: .l9/deployment.yaml
    environments:
      staging: {server_ids: [seo-staging-01], infisical_environment: staging}
      production: {server_ids: [seo-prod-01], infisical_environment: prod}
  # Source-owned profile: Quantum-L9/l9-cognitive-runtime/.l9/deployment.yaml
  # (present at cd388ecfa5cf14269bbcf7e5c1919557947adcf6).
  - id: l9-cognitive-runtime
    repository: Quantum-L9/l9-cognitive-runtime
    profile_path: .l9/deployment.yaml
    environments:
      staging:
        server_ids: [c1]
        infisical_environment: staging
        public_hostnames: [mcp-staging.quantumaipartners.com]
