# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer:
# - repository
# tags:
# - L9_META
# - deployment-platform
# owner: platform
# status: active
# --- /L9_META ---
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "l9-deployment-platform"
version = "0.1.5"
description = "Private, evidence-bearing provisioning and deployment control plane for Quantum-L9"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12.20241230",
]

[project.scripts]
l9-deploy = "l9_deploy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/l9_deploy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["l9_deploy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -W error"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
[tool.coverage.run]
branch = true
source = ["l9_deploy"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "artifacts/coverage.xml"

