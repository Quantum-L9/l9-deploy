# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer: [ci, rollback]
# tags: [L9_CONTRACT, protected-environment, rollback]
# owner: platform
# status: active
# --- /L9_META ---
name: Rollback
on:
  workflow_dispatch:
    inputs:
      project:
        type: string
        required: true
      environment:
        type: choice
        required: true
        options: [staging, production]
      incident-id:
        type: string
        required: true
      expected-plan-digest:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  authorize:
    name: authorize
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check uv==0.11.14
      - run: uv sync --all-extras --frozen
      - uses: ./.github/actions/collect-approval
        with:
          request-id: ${{ inputs.incident-id }}
          requester: ${{ github.actor }}
          environment: ${{ inputs.environment }}
          plan-digest: ${{ inputs.expected-plan-digest }}
          job-name: authorize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-approval-${{ github.run_id }}
          path: artifacts/approval
          if-no-files-found: error
          retention-days: 90
  rollback:
    needs: authorize
    runs-on: [self-hosted, l9-deployment, hetzner-private]
    concurrency: rollback-${{ inputs.environment }}-${{ inputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - run: uv sync --all-extras --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rollback-approval-${{ github.run_id }}
          path: artifacts/approval
      - run: >-
          uv run l9-deploy rollback
          --project "${{ inputs.project }}"
          --fleet fleet/registry.yaml
          --environment "${{ inputs.environment }}"
          --expected-plan-digest "${{ inputs.expected-plan-digest }}"
          --approval-receipt artifacts/approval/approval-receipt.json
          --approval-history artifacts/approval/approval-history.json
          --approval-run-id "${{ github.run_id }}"
          --request-id "${{ inputs.incident-id }}"
          --requester "${{ github.actor }}"
          --receipt-ledger-root receipts/ledger
          --output receipts/latest/rollback.json
          --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rollback-receipts-${{ github.run_id }}
          path: receipts
          if-no-files-found: warn
          retention-days: 365
