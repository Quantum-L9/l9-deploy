name: Fleet Conformance
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, l9-deployment, hetzner-private]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/generate-inventory.py
      - run: ansible-playbook -i ansible/inventories/generated/hosts.yml ansible/playbooks/verify.yml
      - run: uv run l9-deploy fleet verify --fleet fleet/registry.yaml --output fleet-conformance.json --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fleet-conformance-${{ github.run_id }}
          path: fleet-conformance.json
          if-no-files-found: warn
          retention-days: 30
