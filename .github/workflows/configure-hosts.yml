# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer: [ci, configuration]
# tags: [L9_CONTRACT, protected-environment, ansible]
# owner: platform
# status: active
# --- /L9_META ---
name: Configure Hosts
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [management, staging, production]
      playbook:
        type: choice
        required: true
        options: [bootstrap, harden, configure-runner, configure-runtime, configure-backups, verify]
      server-id:
        description: Exact registered server to configure. Leave empty only for an intentional environment-wide run.
        type: string
        required: false
        default: ""
      allow-environment-wide:
        description: Explicitly authorize configuration across the selected environment when server-id is empty.
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      plan-digest: ${{ steps.plan.outputs.plan-digest }}
      limit: ${{ steps.plan.outputs.limit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check uv==0.11.14
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/generate-inventory.py
      - id: plan
        name: Build deterministic configuration plan
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_PLAYBOOK: ${{ inputs.playbook }}
          TARGET_SERVER_ID: ${{ inputs.server-id }}
          ALLOW_ENVIRONMENT_WIDE: ${{ inputs.allow-environment-wide }}
        run: |
          set -euo pipefail
          args=(
            --repository-revision "$GITHUB_SHA"
            --fleet fleet/registry.yaml
            --playbook "ansible/playbooks/${TARGET_PLAYBOOK}.yml"
            --inventory ansible/inventories/generated/hosts.yml
            --environment "$TARGET_ENVIRONMENT"
            --output configuration-plan.json
          )
          if [ -n "$TARGET_SERVER_ID" ]; then
            args+=(--server-id "$TARGET_SERVER_ID")
          fi
          if [ "$ALLOW_ENVIRONMENT_WIDE" = true ]; then
            args+=(--allow-environment-wide)
          fi
          uv run python scripts/prepare-configuration-plan.py "${args[@]}"
          {
            echo "plan-digest=$(jq -er '.plan_digest' configuration-plan.json)"
            echo "limit=$(jq -er '.target.limit' configuration-plan.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-plan-${{ github.run_id }}
          path: configuration-plan.json
          if-no-files-found: error
          retention-days: 90
  authorize:
    name: authorize
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check uv==0.11.14
      - run: uv sync --all-extras --frozen
      - uses: ./.github/actions/collect-approval
        with:
          request-id: config-${{ github.run_id }}
          requester: ${{ github.actor }}
          environment: ${{ inputs.environment }}
          plan-digest: ${{ needs.plan.outputs.plan-digest }}
          job-name: authorize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-approval-${{ github.run_id }}
          path: artifacts/approval
          if-no-files-found: error
          retention-days: 90
  configure:
    needs: [plan, authorize]
    runs-on: [self-hosted, l9-deployment, hetzner-private]
    concurrency: config-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: uv sync --all-extras --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: configuration-plan-${{ github.run_id }}
          path: artifacts/configuration-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: configuration-approval-${{ github.run_id }}
          path: artifacts/approval
      - run: uv run python scripts/generate-inventory.py
      - id: verify-plan
        name: Recompute and verify approved configuration plan
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_PLAYBOOK: ${{ inputs.playbook }}
          TARGET_SERVER_ID: ${{ inputs.server-id }}
          ALLOW_ENVIRONMENT_WIDE: ${{ inputs.allow-environment-wide }}
          APPROVED_PLAN_DIGEST: ${{ needs.plan.outputs.plan-digest }}
        run: |
          set -euo pipefail
          args=(
            --repository-revision "$GITHUB_SHA"
            --fleet fleet/registry.yaml
            --playbook "ansible/playbooks/${TARGET_PLAYBOOK}.yml"
            --inventory ansible/inventories/generated/hosts.yml
            --environment "$TARGET_ENVIRONMENT"
            --output configuration-plan.current.json
          )
          if [ -n "$TARGET_SERVER_ID" ]; then
            args+=(--server-id "$TARGET_SERVER_ID")
          fi
          if [ "$ALLOW_ENVIRONMENT_WIDE" = true ]; then
            args+=(--allow-environment-wide)
          fi
          uv run python scripts/prepare-configuration-plan.py "${args[@]}"
          cmp --silent \
            artifacts/configuration-plan/configuration-plan.json \
            configuration-plan.current.json
          test "$(jq -er '.plan_digest' configuration-plan.current.json)" = "$APPROVED_PLAN_DIGEST"
          echo "limit=$(jq -er '.target.limit' configuration-plan.current.json)" >> "$GITHUB_OUTPUT"
      - name: Check configuration
        run: >-
          uv run l9-deploy config check
          --playbook "ansible/playbooks/${{ inputs.playbook }}.yml"
          --inventory ansible/inventories/generated/hosts.yml
          --limit "${{ steps.verify-plan.outputs.limit }}"
          --json
      - name: Apply configuration
        run: >-
          uv run l9-deploy config apply
          --environment "${{ inputs.environment }}"
          --expected-plan-digest "${{ needs.plan.outputs.plan-digest }}"
          --approval-receipt artifacts/approval/approval-receipt.json
          --approval-history artifacts/approval/approval-history.json
          --approval-run-id "${{ github.run_id }}"
          --request-id "config-${{ github.run_id }}"
          --requester "${{ github.actor }}"
          --playbook "ansible/playbooks/${{ inputs.playbook }}.yml"
          --inventory ansible/inventories/generated/hosts.yml
          --limit "${{ steps.verify-plan.outputs.limit }}"
          --json
