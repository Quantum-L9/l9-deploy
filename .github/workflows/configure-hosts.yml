# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer: [ci, configuration]
# tags: [L9_CONTRACT, protected-environment, ansible]
# owner: platform
# status: active
# --- /L9_META ---
name: Configure Hosts
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [management, staging, production]
      playbook:
        type: choice
        required: true
        options: [bootstrap, harden, configure-runner, configure-runtime, configure-backups, verify]
      server-id:
        description: Exact registered server to configure. Leave empty only for an intentional environment-wide run.
        type: string
        required: false
        default: ""
      allow-environment-wide:
        description: Explicitly authorize configuration across the selected environment when server-id is empty.
        type: boolean
        required: true
        default: false
      expected-plan-digest:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  authorize:
    name: authorize
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check uv==0.11.14
      - run: uv sync --all-extras --frozen
      - uses: ./.github/actions/collect-approval
        with:
          request-id: config-${{ github.run_id }}
          requester: ${{ github.actor }}
          environment: ${{ inputs.environment }}
          plan-digest: ${{ inputs.expected-plan-digest }}
          job-name: authorize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-approval-${{ github.run_id }}
          path: artifacts/approval
          if-no-files-found: error
          retention-days: 90
  configure:
    needs: authorize
    runs-on: [self-hosted, l9-deployment, hetzner-private]
    concurrency: config-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: uv sync --all-extras --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: configuration-approval-${{ github.run_id }}
          path: artifacts/approval
      - run: uv run python scripts/generate-inventory.py
      - id: target
        name: Resolve bounded configuration target
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_SERVER_ID: ${{ inputs.server-id }}
          ALLOW_ENVIRONMENT_WIDE: ${{ inputs.allow-environment-wide }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          environment = os.environ["TARGET_ENVIRONMENT"].strip()
          server_id = os.environ["TARGET_SERVER_ID"].strip()
          allow_environment_wide = os.environ["ALLOW_ENVIRONMENT_WIDE"].strip().lower() == "true"

          if server_id:
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", server_id):
                  raise SystemExit("invalid server-id")
              fleet = yaml.safe_load(Path("fleet/registry.yaml").read_text(encoding="utf-8"))
              matches = [server for server in fleet["servers"] if server["id"] == server_id]
              if len(matches) != 1:
                  raise SystemExit("server-id is not uniquely registered in fleet/registry.yaml")
              if matches[0]["environment"] != environment:
                  raise SystemExit("server-id does not belong to the selected environment")
              limit = server_id
          else:
              if not allow_environment_wide:
                  raise SystemExit(
                      "environment-wide configuration requires allow-environment-wide=true"
                  )
              limit = environment

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"limit={limit}\n")
          PY
      - name: Check configuration
        run: >-
          uv run l9-deploy config check
          --playbook "ansible/playbooks/${{ inputs.playbook }}.yml"
          --inventory ansible/inventories/generated/hosts.yml
          --limit "${{ steps.target.outputs.limit }}"
          --json
      - name: Apply configuration
        run: >-
          uv run l9-deploy config apply
          --environment "${{ inputs.environment }}"
          --expected-plan-digest "${{ inputs.expected-plan-digest }}"
          --approval-receipt artifacts/approval/approval-receipt.json
          --approval-history artifacts/approval/approval-history.json
          --approval-run-id "${{ github.run_id }}"
          --request-id "config-${{ github.run_id }}"
          --requester "${{ github.actor }}"
          --playbook "ansible/playbooks/${{ inputs.playbook }}.yml"
          --inventory ansible/inventories/generated/hosts.yml
          --limit "${{ steps.target.outputs.limit }}"
          --json
