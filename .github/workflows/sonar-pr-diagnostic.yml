# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer: [ci, diagnostics]
# tags: [L9_CONTRACT, sonar, temporary]
# owner: platform
# status: temporary
# --- /L9_META ---
name: Sonar PR Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - name: Query SonarQube Cloud PR issues
        env:
          SONAR_PROJECT: Quantum-L9_l9-deploy
          SONAR_PR: "25"
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode "componentKeys=${SONAR_PROJECT}" \
            --data-urlencode "pullRequest=${SONAR_PR}" \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' \
            --data-urlencode 'additionalFields=rules')"
          echo "sonar_http_status=${status}"
          if [ "$status" != "200" ]; then
            jq -c '{errors}' "$response" 2>/dev/null || cat "$response"
            exit 1
          fi
          jq -c '{total: .total, paging: .paging}' "$response"
          jq -c '.issues[] | {key, rule, severity, component, project, line, message, type, status, impacts, cleanCodeAttribute}' "$response"
