# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer:
# - repository
# tags:
# - L9_META
# - deployment-platform
# owner: platform
# status: active
# --- /L9_META ---
name: Release Platform
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check uv==0.11.14
      - run: uv sync --all-extras --frozen
      - run: make validate
      - name: Bind release artifacts to the source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - run: make release-prepare
      - name: Create detached release directory
        run: mkdir -p "${{ runner.temp }}/l9-deployment-platform-release"
      - name: Build Python distributions outside the validated source tree
        run: >-
          uv build
          --out-dir "${{ runner.temp }}/l9-deployment-platform-release"
      - name: Build deterministic repository archive and detached receipt
        run: >-
          uv run python scripts/build-release-archive.py
          --output "${{ runner.temp }}/l9-deployment-platform-release/l9-deployment-platform-${{ github.ref_name }}.zip"
          --receipt "${{ runner.temp }}/l9-deployment-platform-release/l9-deployment-platform-${{ github.ref_name }}.receipt.json"
      - name: Verify archive, source parity, and receipt binding
        run: >-
          uv run python scripts/validate-release-pack.py
          --archive "${{ runner.temp }}/l9-deployment-platform-release/l9-deployment-platform-${{ github.ref_name }}.zip"
          --receipt "${{ runner.temp }}/l9-deployment-platform-release/l9-deployment-platform-${{ github.ref_name }}.receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distribution-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/l9-deployment-platform-release/*
            MANIFEST.json
            MANIFEST.md
            checksums.sha256
            VALIDATION.md
            UNKNOWN_REGISTER.md
          if-no-files-found: error
          retention-days: 90
