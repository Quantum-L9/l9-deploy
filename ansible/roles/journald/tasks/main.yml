- name: Configure bounded persistent journald
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-l9.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
      MaxRetentionSec=14day
      Compress=yes
  notify: Restart journald
