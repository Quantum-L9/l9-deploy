- name: Install nftables
  ansible.builtin.apt: {name: nftables, state: present}
- name: Render nftables rules
  ansible.builtin.template: {src: nftables.conf.j2, dest: /etc/nftables.conf, owner: root, group: root, mode: "0644"}
  notify: Reload nftables
- name: Enable nftables
  ansible.builtin.service: {name: nftables, enabled: true, state: started}
