# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer:
# - repository
# tags:
# - L9_META
# - deployment-platform
# owner: platform
# status: active
# --- /L9_META ---
- name: Install Docker repository prerequisites
  ansible.builtin.apt: {name: [ca-certificates, curl, gnupg], state: present}
- name: Install Docker signing key
  ansible.builtin.get_url: {url: https://download.docker.com/linux/ubuntu/gpg, dest: /etc/apt/keyrings/docker.asc, mode: "0644"}
- name: Configure Docker apt repository
  ansible.builtin.apt_repository: {repo: "deb [arch={{ ansible_architecture | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable", state: present}
- name: Install Docker runtime
  ansible.builtin.apt: {name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin], state: present, update_cache: true}
- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {"log-driver":"local","live-restore":true,"no-new-privileges":true}
  notify: Restart docker
- name: Ensure runtime network exists
  community.docker.docker_network: {name: "{{ l9_runtime_network }}", state: present}
