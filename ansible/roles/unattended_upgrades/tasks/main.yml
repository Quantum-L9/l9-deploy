# --- L9_META ---
# l9_schema: 1
# origin: l9-deployment-platform
# layer:
# - repository
# tags:
# - L9_META
# - deployment-platform
# owner: platform
# status: active
# --- /L9_META ---
- name: Install unattended upgrades
  ansible.builtin.apt: {name: unattended-upgrades, state: present}
- name: Configure automatic upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52l9-unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ l9_unattended_reboot_time }}";
