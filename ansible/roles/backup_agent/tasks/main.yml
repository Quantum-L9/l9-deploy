- name: Install backup dependencies
  ansible.builtin.apt: {name: [postgresql-client, gzip, restic], state: present}
- name: Install canonical PostgreSQL backup command
  ansible.builtin.copy: {src: l9-postgres-backup, dest: /usr/local/sbin/l9-postgres-backup, owner: root, group: l9deploy, mode: "0750"}
- name: Install canonical backup verification command
  ansible.builtin.copy: {src: l9-backup-verify, dest: /usr/local/sbin/l9-backup-verify, owner: root, group: l9deploy, mode: "0750"}
