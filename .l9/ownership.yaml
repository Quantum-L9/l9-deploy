schema: l9.ownership/v1
rules:
  - paths: ["schemas/**", "src/l9_deploy/contracts/**"]
    owner: deployment-contracts
  - paths: ["infrastructure/**"]
    owner: infrastructure
  - paths: ["ansible/**", "runner/**"]
    owner: platform-operations
  - paths: ["src/l9_deploy/execution/**", "deployment/**"]
    owner: deployment-engine
  - paths: [".github/workflows/**", "integrations/**", "templates/consumer/**"]
    owner: platform-integrations
  - paths: ["docs/**", "README.md", "RUNBOOK.md"]
    owner: platform-documentation
