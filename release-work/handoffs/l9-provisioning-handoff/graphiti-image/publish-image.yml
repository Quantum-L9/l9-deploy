# GHCR publish workflow FOR Quantum-L9/l9-graphiti-memory.
# Place at .github/workflows/publish-image.yml in THAT repo (not l9-deploy).
# Publishes ghcr.io/quantum-l9/l9-graphiti-memory by digest, with provenance + SBOM.
name: Publish memory-server image
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/quantum-l9/l9-graphiti-memory
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push (with SBOM + provenance)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/quantum-l9/l9-graphiti-memory
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
